# K1C
# Printer_size: 220x220x250
# Version: v2.1.9 Maurer
# CreateDate: 2026/3/4
# Nozzle_mcu: chip: GD32F303CBT6
#             version: CR-K1-MAX-NOZZLE-V1.2.0
# Leveling_mcu: chip: GD32E230F8P6
#             version: CR-K1-MAX-LEVELING-V1.1.0
# mcu: chip: GD32F303RET6
#      version: CR4CU220812S12

[include sensorless.cfg]
[include gcode_macro.cfg]
[include printer_params.cfg]
[include box.cfg]
[virtual_pins]
[include sensorless.cfg]
[include gcode_macro.cfg]
[include printer_params.cfg]
[include Helper-Script/buzzer-support.cfg]
[include GuppyScreen/*.cfg]
[include Helper-Script/timelapse.cfg]
[include Helper-Script/screws-tilt-adjust.cfg]
[include Helper-Script/M600-support.cfg]
[include Helper-Script/save-zoffset.cfg]
[include Helper-Script/useful-macros-Maurer.cfg]
[include Helper-Script/fans-control-Maurer.cfg]
[include Helper-Script/nozzle-cleaning-fan-control.cfg]
[include Helper-Script/KAMP/KAMP_Settings.cfg]

[mcu]
serial: /dev/ttyS7
baud: 230400 # 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS1
baud: 230400 # 230400
restart_method: command

[mcu leveling_mcu]
serial: /dev/ttyS9
baud: 230400 # 230400
restart_method: command

[verify_heater extruder] #NEW CONFIG FOR TESTING 06/03/2026 #Maurer
check_gain_time: 30
heating_gain: 2
hysteresis: 5

[verify_heater heater_bed] #NEW CONFIG FOR TESTING 06/03/2026 #Maurer
check_gain_time: 120
heating_gain: 1
hysteresis: 10

[mcu rpi]
serial: /tmp/klipper_host_mcu

[bl24c16f]
i2c_mcu: rpi
i2c_bus: i2c.2
i2c_speed: 400000

[idle_timeout]
timeout: 3600

[virtual_sdcard]
path: /usr/data/printer_data/gcodes

[gcode_arcs]
resolution: 1.0

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 125

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16 # 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 229
position_min: -5
position_max: 229
gcode_position_max: 225
homing_speed: 30
homing_retract_dist:0

[tmc2209 stepper_x]
uart_pin:PA9
interpolate: True
run_current:1.2 #1.5
hold_current:0.8 #1.0
sense_resistor: 0.100
stealthchop_threshold: 0
uart_address:3
diag_pin: ^PB12
# New parameters for testing
#driver_TBL:2 # 1
#driver_TOFF:4 # 1
#driver_HEND:3 # 0
#driver_HSTRT:1 # 7
driver_SGTHRS:70 # 75

[stepper_y]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PC3
microsteps: 16 # 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -0.5
position_min: -0.5
position_max: 228
gcode_position_max: 225
homing_speed: 30
homing_retract_dist:0

[tmc2209 stepper_y]
uart_pin:PA10
interpolate: True # True
run_current:1.2 #1.5
hold_current:0.8 #1.0
sense_resistor: 0.100
stealthchop_threshold: 0
uart_address:3
diag_pin: ^PB13
# New parameters for testing
#driver_TBL:2 # 1
#driver_TOFF:4 # 1
#driver_HEND:3 # 0
#driver_HSTRT:1 # 7
driver_SGTHRS:70 # 75

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance:8
gear_ratio: 64:20
endstop_pin: tmc2209_stepper_z:virtual_endstop# PA15   #probe:z_virtual_endstop
position_endstop: 0
position_max: 255
position_min: -5

[tmc2209 stepper_z]
uart_pin: PA11
interpolate: True # false not used before
uart_address: 3
run_current: 0.8
diag_pin: ^PB14
stealthchop_threshold: 0
sense_resistor: 0.100
driver_SGTHRS: 0

[extruder]
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 15 #Maurer 06/03/2026 max_extrude_cross_section: 80 prevent extrusion of large amounts of filament during purge, which can cause clogs and other issues. Adjust as needed based on your printer's capabilities and typical purge requirements.
step_pin: nozzle_mcu:PB1
dir_pin: nozzle_mcu:PB0
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040
min_temp: 0
max_temp: 320
min_extrude_temp: 200 #Maurer 06/03/2026  New parameter to prevent extrusion below a certain temperature, which can help avoid clogs and damage to the extruder. Adjust as needed for your filament types.

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB11
interpolate: True  # false not used before
tx_pin: nozzle_mcu:PB10
uart_address: 3
run_current: 0.55
sense_resistor: 0.150
stealthchop_threshold: 0

[heater_bed]
heater_pin: PB10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 115

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !PC15
runout_gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G0 E30 F600
    G90
  {% endif %}

[filament_switch_sensor filament_sensor_2]
pause_on_runout: true
switch_pin: !nozzle_mcu:PA10

[multi_pin heater_fans]
pins:nozzle_mcu:PB5,PB2

[heater_fan hotend_fan]
pin: multi_pin:heater_fans
heater: extruder
heater_temp: 40

[static_digital_output my_fan_output_pins]
pins: nozzle_mcu: PB6

[output_pin fan0]
pin: !nozzle_mcu: PB8
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin fan1]
pin: PC0
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin fan2]
pin: PB1
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin LED]
pin:PB0
pwm: True
cycle_time: 0.010
value: 1

[adxl345]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,-z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 75
# min_freq: 30
# max_freq: 100
probe_points:
   110,110,10

# Maurer K1C-A1 mini nozzle Cleaner 06/03/2026 #Maurer

[prtouch_v2] # módulo PR-Touch v2 usado para leitura de sensores de pressão e rotina de limpeza do nozzle
pr_version: 1                       # versão do protocolo/configuração do módulo PR-Touch
step_base: 2                        # resolução base de step usada no cálculo de movimento durante a detecção de pressão
z_offset: 0                         # offset final aplicado ao eixo Z após a medição do sensor
noz_ex_com: 0.06                    # compensação da expansão térmica do nozzle (dilatação quando aquecido)
tilt_corr_dis: 0.03                 # distância usada para correção de inclinação da mesa após leitura dos sensores
tri_min_hold: 2000                  # limite mínimo de pressão para considerar que houve contato
tri_max_hold: 6000                  # limite máximo de pressão aceitável antes de considerar erro ou excesso de força
pres_cnt: 4                         # quantidade de sensores de pressão usados no sistema
pres0_clk_pins: leveling_mcu:PA5    # pino de clock do sensor de pressão 0
pres0_sdo_pins: leveling_mcu:PA1    # pino de dados (SDO) do sensor de pressão 0
pres1_clk_pins: leveling_mcu:PA2    # pino de clock do sensor de pressão 1
pres1_sdo_pins: leveling_mcu:PA0    # pino de dados (SDO) do sensor de pressão 1
pres2_clk_pins: leveling_mcu:PA6    # pino de clock do sensor de pressão 2
pres2_sdo_pins: leveling_mcu:PA3    # pino de dados (SDO) do sensor de pressão 2
pres3_clk_pins: leveling_mcu:PA7    # pino de clock do sensor de pressão 3
pres3_sdo_pins: leveling_mcu:PA4    # pino de dados (SDO) do sensor de pressão 3
show_msg: false                     # define se o sistema exibirá mensagens de debug no console
step_swap_pin: PC10                 # pino usado para alternar ou sincronizar controle do stepper durante medições
pres_swap_pin: leveling_mcu:PB1     # pino usado para alternar a leitura entre sensores de pressão
g28_wait_cool_down: true            # força o G28 (homing) esperar o hotend esfriar para evitar erro por dilatação térmica
pa_clr_down_mm: -0.15               # durante a limpeza do nozzle, o bico desce 0.15mm para pressionar o limpador
speeds: 2.5,0.5                     # velocidades usadas na rotina de detecção/pressão (aproximação e contato)
tri_hftr_cut: 2,1                   # parâmetros de filtro de alta frequência usados para estabilizar leitura do sensor
tri_lftr_k1: 0.70,0.30              # parâmetros de filtro de baixa frequência para suavizar ruído da leitura
tri_try_max_times: 10               # número máximo de tentativas de leitura do sensor antes de gerar erro
tri_min_hold: 2000,20000            # limites mínimos de pressão para dois modos de operação (normal e segurança)
tri_max_hold: 6000,60000            # limites máximos de pressão para dois modos de operação (normal e segurança)

clr_noz_quick: true                 # ativa modo de limpeza rápida do nozzle
clr_noz_start_x: 93                 # posição X onde começa a área de limpeza do nozzle
clr_noz_start_y: 225                # posição Y onde começa a área de limpeza do nozzle
clr_noz_len_x: 36                   # comprimento da área de limpeza no eixo X
clr_noz_len_y: 3                    # largura da área de limpeza no eixo Y
clr_quick_high:0.7                  # altura Z usada durante a limpeza rápida
clr_xy_quick_spd:100                # velocidade de movimento XY durante a limpeza rápida
clr_quick_times:10                  # quantidade de passadas que o nozzle fará no limpador
clr_quick_react_dis:5               # distância de retração após cada movimento de limpeza

[bed_mesh]
speed: 150
mesh_min: 5,5
mesh_max: 215,215
probe_count: 5,5
fade_start: 5.0
fade_end: 50.0

[display_status]

[printer] # Kinematics and motion settings Otimized for K1C 06/03/2026 by #Maurer
kinematics: corexy
max_velocity: 600
max_accel: 16000
max_accel_to_decel: 12000
#minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0
max_z_velocity: 10
max_z_accel: 300
square_corner_max_velocity: 200.0

[force_move]
enable_force_move: True

[pause_resume]
# recover_velocity: 500.

[exclude_object]

