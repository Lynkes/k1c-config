# Note_printer.cfg — K1C com Klipper host no notebook
# =====================================================
# Versão do printer.cfg adaptada para correr klippy.py + Moonraker no notebook,
# com os 3 MCUs ligados via adaptadores USB-UART (CH340/CP2102/FT232, 3.3V).
#
# HARDWARE NECESSÁRIO
# -------------------
# 3x adaptador USB-UART 3.3V (CH340G, CP2102 ou FT232RL)
# Fios finos para soldar nos pads UART de cada placa
#
# PINAGEM — intercetar os sinais entre o SoC e cada MCU:
#
#   MCU principal (GD32F303RET6)
#     SoC /dev/ttyS7 → pinos UART0 do GD32: PA9 (TX) / PA10 (RX)
#     Adaptador 1 → /dev/ttyUSB0  (baud 230400)
#     ATENÇÃO: ligar TX do GD32 → RX do adaptador, e vice-versa
#              O SoC pode precisar ser desligado ou os pinos isolados com díodos
#
#   Nozzle MCU (GD32F303CBT6)
#     SoC /dev/ttyS1 → pinos UART do GD32 no cabeçote: PB10 (TX) / PB11 (RX)
#     Adaptador 2 → /dev/ttyUSB1  (baud 230400)
#
#   Leveling MCU (GD32E230F8P6)
#     SoC /dev/ttyS9 → pinos UART do GD32 na placa de nivelamento
#     Adaptador 3 → /dev/ttyUSB2  (baud 230400)
#
# NOTA SOBRE NOMES DE DISPOSITIVOS NO LINUX
# ------------------------------------------
# Os adaptadores podem enumerar em qualquer ordem (/dev/ttyUSB0..2).
# Para endereçamento estável usar by-id:
#   /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0   (CH340)
#   /dev/serial/by-id/usb-Silicon_Labs_CP2102_...-port0
# Listar com: ls /dev/serial/by-id/
#
# MCU RPI (linux MCU do SoC K1C)
# --------------------------------
# Comentado abaixo — a K1C SoC pode ser desligada neste modo.
# Consequências:
#   - [bl24c16f] EEPROM I2C inativa → z-offset guardado em variables.cfg
#   - Câmera gerida independentemente pelo notebook
#
# INSTALAÇÃO DO KLIPPER NO NOTEBOOK (Linux)
# ------------------------------------------
#   cd /path/to/K1_Series_Klipper-main
#   python3 -m venv venv
#   venv/bin/pip install -r scripts/klippy-requirements.txt
#   make                    # compila chelper (extensão C via cffi)
#   venv/bin/python klippy/klippy.py /path/to/Note_printer.cfg \
#       -l /tmp/klippy.log -a /tmp/klippy_uds
# =====================================================

[include sensorless.cfg]
[include gcode_macro.cfg]
[include printer_params.cfg]
[include box.cfg]
[virtual_pins]
[include Maurer-Script/buzzer-support.cfg]
[include Maurer-Script/guppy-cmd.cfg]
[include Maurer-Script/guppy-update.cfg]
[include Helper-Script/timelapse.cfg]
[include Maurer-Script/screws-tilt-adjust.cfg]
[include Maurer-Script/M600-support.cfg]
[include Maurer-Script/save-zoffset.cfg]
[include Maurer-Script/useful-macros.cfg]
[include Maurer-Script/fans-control.cfg]
[include Maurer-Script/nozzle-cleaning-fan-control.cfg]
[include Maurer-Script/resonance-calibration.cfg]
[include Maurer-Script/KAMP/KAMP_Settings.cfg]

# -----------------------------------------------------------------------------
# MCUs — seriais USB-UART
# Ajustar os caminhos conforme enumeração real ou usar by-id para estabilidade
# -----------------------------------------------------------------------------

[mcu]
# GD32F303RET6 — placa principal — adaptador USB-UART 1
serial: /dev/ttyUSB0
# serial: /dev/serial/by-id/usb-XXXX_XXXX-port0   # alternativa estável
baud: 230400
restart_method: command

[mcu nozzle_mcu]
# GD32F303CBT6 — cabeçote — adaptador USB-UART 2
serial: /dev/ttyUSB1
# serial: /dev/serial/by-id/usb-XXXX_XXXX-port0
baud: 230400
restart_method: command

[mcu leveling_mcu]
# GD32E230F8P6 — placa de nivelamento — adaptador USB-UART 3
serial: /dev/ttyUSB2
# serial: /dev/serial/by-id/usb-XXXX_XXXX-port0
baud: 230400
restart_method: command

# [mcu rpi]
# Linux MCU do SoC K1C — desativado neste modo
# Ativar apenas se o SoC continuar a correr em paralelo com socat:
#   socat TCP-LISTEN:7780,reuseaddr,fork UNIX-CONNECT:/tmp/klipper_host_mcu &
# serial: socket://192.168.1.105:7780

# [bl24c16f]
# EEPROM I2C — depende do [mcu rpi] — desativado
# z-offset será guardado em Maurer-Script/variables.cfg via SAVE_CONFIG
# i2c_mcu: rpi
# i2c_bus: i2c.2
# i2c_speed: 400000

[verify_heater extruder]
check_gain_time: 30
heating_gain: 2
hysteresis: 5

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1
hysteresis: 10

[idle_timeout]
timeout: 99999999

[virtual_sdcard]
# Ajustar para o caminho local do notebook onde ficam os G-codes
path: ~/printer_data/gcodes

[gcode_arcs]
resolution: 1.0

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 125

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 229
position_min: -5
position_max: 229
gcode_position_max: 225
homing_speed: 80
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PA9
interpolate: True
run_current: 1.2
hold_current: 0.8
sense_resistor: 0.100
stealthchop_threshold: 0
uart_address: 3
diag_pin: ^PB12
driver_SGTHRS: 75

[stepper_y]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -0.5
position_min: -0.5
position_max: 228
gcode_position_max: 225
homing_speed: 80
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PA10
interpolate: True
run_current: 1.2
hold_current: 0.8
sense_resistor: 0.100
stealthchop_threshold: 0
uart_address: 3
diag_pin: ^PB13
driver_SGTHRS: 75

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
gear_ratio: 64:20
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_endstop: 0
position_max: 255
position_min: -5

[tmc2209 stepper_z]
uart_pin: PA11
interpolate: True
uart_address: 3
run_current: 0.8
diag_pin: ^PB14
stealthchop_threshold: 0
sense_resistor: 0.100
driver_SGTHRS: 0

[extruder]
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 15
step_pin: nozzle_mcu:PB1
dir_pin: nozzle_mcu:PB0
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040
min_temp: 0
max_temp: 320
min_extrude_temp: 200

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB11
interpolate: True
tx_pin: nozzle_mcu:PB10
uart_address: 3
run_current: 0.55
sense_resistor: 0.150
stealthchop_threshold: 0

[heater_bed]
heater_pin: PB10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 115

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !PC15
runout_gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    {% set advance_mm = [printer.extruder.max_extrude_only_distance, 30]|min %}
    M83
    G1 E{advance_mm} F300
    M82
  {% endif %}

[filament_switch_sensor filament_sensor_2]
pause_on_runout: true
switch_pin: !nozzle_mcu:PA10

[multi_pin heater_fans]
pins: nozzle_mcu:PB5,PB2

[heater_fan hotend_fan]
pin: multi_pin:heater_fans
heater: extruder
heater_temp: 40

[static_digital_output my_fan_output_pins]
pins: nozzle_mcu:PB6

[output_pin fan0]
pin: !nozzle_mcu:PB8
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin fan1]
pin: PC0
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin fan2]
pin: PB1
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin LED]
pin: PB0
pwm: True
cycle_time: 0.010
value: 1

[adxl345]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,-z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 75
probe_points:
  110,110,10

[prtouch_v2]
pr_version: 2
step_base: 2
z_offset: 0
noz_ex_com: 0.06
tilt_corr_dis: 0.03
tri_min_hold: 2000
tri_max_hold: 6000
pres_cnt: 4
pres0_clk_pins: leveling_mcu:PA5
pres0_sdo_pins: leveling_mcu:PA1
pres1_clk_pins: leveling_mcu:PA2
pres1_sdo_pins: leveling_mcu:PA0
pres2_clk_pins: leveling_mcu:PA6
pres2_sdo_pins: leveling_mcu:PA3
pres3_clk_pins: leveling_mcu:PA7
pres3_sdo_pins: leveling_mcu:PA4
show_msg: false
step_swap_pin: PC10
pres_swap_pin: leveling_mcu:PB1
g28_wait_cool_down: true
pa_clr_down_mm: -0.15
speeds: 2.5,0.5
tri_hftr_cut: 2,1
tri_lftr_k1: 0.70,0.30
tri_try_max_times: 10
tri_min_hold: 2000,20000
tri_max_hold: 6000,60000
pa_clr_dis_mm: 20
clr_noz_start_x: 94
clr_noz_start_y: 226
clr_noz_len_x: 32
clr_noz_len_y: 3

[bed_mesh]
speed: 150
mesh_min: 5,5
mesh_max: 215,215
probe_count: 5,5
fade_start: 5.0
fade_end: 10.0

[display_status]

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 12000
max_accel_to_decel: 6000
square_corner_velocity: 5.0
max_z_velocity: 10
max_z_accel: 300
square_corner_max_velocity: 200.0

[pause_resume]

[exclude_object]
