########################################
# Nozzle Cleaning Fan Control          #Maurer
########################################

[prtouch_v2_fan]
max_speed: 0.5

# =============================================================================
# NOZZLE_CLEAR — macro customizada que substitui o clear_nozzle() nativo do v2
# =============================================================================
#
# O clear_nozzle() nativo do prtouch_v2_wrapper.py faz o seguinte (mapeado aqui
# para facilitar comparação e manutenção futura):
#
# 1. PRÉ-AQUECIMENTO ASSÍNCRONO
#    Inicia bed e nozzle → hot_min_temp em paralelo (sem bloquear).
#    Adicionalmente dispara hot_min_temp+40 de forma assíncrona logo após a
#    primeira sondagem, para acelerar a chegada à hot_max_temp.
#    Nossa macro: idem — M140 assíncrono + M109 bloqueante em hot_min_temp.
#
# 2. VERIFICAÇÃO DE HOMING (ck_g28ed)
#    O nativo verifica se os eixos estão homeados e faz G28 se necessário.
#    Nossa macro: idem — guard "xyz" not in homed_axes.
#
# 3. SUSPENSÃO DA BED MESH
#    O nativo salva o mesh ativo e chama set_mesh(None) antes de qualquer
#    movimento para o wiper, restaurando ao final. Isto evita que a compensação
#    de altura da mesh interfira nas medições de Z do prtouch durante a limpeza.
#    Nossa macro: NÃO suspende o mesh — aceitável porque usamos Z fixo calibrado
#    e não fazemos Z-probing, portanto a mesh não distorce o contato com o wiper.
#
# 4. AJUSTE DOS PARÂMETROS DO STEPPER (set_step_par)
#    O nativo troca os parâmetros de movimento do stepper Z para os valores de
#    precisão do prtouch (corrente, microstepping, accel) antes das sondagens,
#    restaurando ao final. Necessário porque run_step_prtouch usa movimento de
#    baixíssima velocidade que requer configuração especial.
#    Nossa macro: NÃO precisa — não realiza Z-probing com o sensor de pressão.
#
# 5. POSIÇÃO X ALEATÓRIA DENTRO DO WIPER
#    O nativo sorteia um X de início dentro do intervalo disponível:
#      src_x = clr_noz_start_x + random(0, clr_noz_len_x - pa_clr_dis_mm - 5)
#    Isso distribui o desgaste ao longo do wiper em vez de sempre usar o mesmo
#    ponto, prolongando a vida útil do silicone.
#    Nossa macro: usa X fixo (x_s = wiper_start_x + react_dis). Funciona bem
#    mas desgasta sempre a mesma região. Melhoria futura: adicionar aleatorização.
#
# 6. Z-PROBING DINÂMICO COM SENSOR DE PRESSÃO (run_step_prtouch)
#    O nativo sonda Z com o sensor de pressão em dois pontos (src e end) com até
#    3 tentativas cada. Isso compensa eventuais variações de altura do wiper.
#    A altura de contato é pa_clr_down_mm=-0.15 abaixo da superfície detectada,
#    pressionando levemente o silicone para garantir contato.
#    Nossa macro: usa Z FIXO calibrado (variable_wiper_z). Funciona porque o
#    wiper do K1C tem altura muito consistente. Calibrar conforme instruções abaixo.
#
# 7. ÚNICA PASSADA LENTA vs. MÚLTIPLAS PASSADAS RÁPIDAS
#    O nativo faz UMA única passada de pa_clr_dis_mm=20mm a clr_xy_spd=2mm/s
#    (muito lento — ~10s de contato), pressionando 0.15mm abaixo da superfície
#    detectada pelo sensor.
#    Nossa macro: faz wipe_count=10 passadas a wipe_speed=100mm/s. Mais rápido
#    no total mas com mais fricção acumulada — equivalente ou superior em eficácia.
#
# 8. VENTILADOR DE MODELO — BUG DO NATIVO (set_fan_speed 'fan')
#    O nativo chama set_fan_speed('fan', ...) que verifica se existe objeto [fan].
#    No K1C não existe [fan] (usamos [output_pin fan0]), então o código cai no
#    else e chama M106 sem parâmetro P — o que no firmware Creality ativa TANTO
#    P0 (modelo) QUANTO P2 (câmara), ligando o ventilador da câmara
#    indevidamente durante a limpeza.
#    Nossa macro: usa M106 P0 explícito — apenas ventilador de modelo, sem tocar
#    no P2 da câmara. Esta é a principal razão para manter esta macro.
#
# 9. VENTILADOR DE AQUECIMENTO (heater_fan via use_adc)
#    O nativo acelera o fan do hotend ao máximo durante a sondagem src (para
#    aquecer mais rápido) e reduz durante a sondagem end.
#    Nossa macro: o heater_fan é gerenciado automaticamente pelo [heater_fan]
#    do Klipper (liga acima de 40°C), não precisamos controlar manualmente.
#
# 10. SEQUÊNCIA DE TEMPERATURA
#    Nativo: hot_min_temp → sonda Z src → dispara hot_min_temp+40 async →
#            sonda Z end → posiciona ACIMA do wiper → aguarda hot_max_temp →
#            ENTÃO desce e faz a passada de limpeza.
#    Nossa macro: hot_min_temp → sobe approach_z → move X/Y → hot_max_temp →
#                 desce ao wiper_z → passadas. Efeito equivalente.
#
# 11. RESTAURAÇÃO
#    Nativo: restaura mesh, restaura parâmetros do stepper, aguarda bed.
#    Nossa macro: aguarda bed se bed_max_temp > 0 (mesh/stepper não precisam
#    ser restaurados pois não foram alterados).
#
# =============================================================================
# CALIBRAÇÃO do variable_wiper_z:
#   1. Execute G28
#   2. No Mainsail/Fluidd, mova o bico em Z até tocar levemente a superfície do wiper
#   3. Anote o Z exibido — esse é o Z da superfície do wiper
#   4. Subtraia ~0.4 a 0.7mm para pressionar o wiper (ex.: superfície=2.3 → wiper_z=1.7)
#   5. Ajuste até o wiper limpar bem sem forçar
#
# Uso: NOZZLE_CLEAR HOT_MIN_TEMP=140 HOT_MAX_TEMP=220 BED_MAX_TEMP=60
# =============================================================================

[gcode_macro NOZZLE_CLEAR]
rename_existing: _NOZZLE_CLEAR_PRTOUCH
description: Limpa o nozzle no wiper com posição e Z completamente configuráveis
variable_wiper_start_x: 94      # X inicial do wiper (mm) — igual a clr_noz_start_x
variable_wiper_len_x:   32      # comprimento do wiper em X (mm) — igual a clr_noz_len_x
variable_wiper_y:       226     # posição Y do wiper (mm) — igual a clr_noz_start_y
variable_wiper_z:       1.8     # Z de contato com o wiper — CALIBRAR (ver comentário acima)
                                # nativo: detectado dinamicamente por sensor de pressão
variable_approach_z:    4.0     # Z de segurança para movimentos de aproximação (mm)
                                # nativo: usa bed_max_err como Z de transição
variable_wipe_speed:    6000    # velocidade XY das passadas (mm/min = 100 mm/s)
                                # nativo: clr_xy_spd = 2mm/s (muito mais lento, passada única)
variable_park_speed:    18000   # velocidade de deslocamento até o wiper (mm/min)
variable_wipe_count:    10      # número de passadas no wiper
                                # nativo: sempre 1 passada (sem modo multi-pass no v2)
variable_react_dis:     6       # margem X retirada de cada extremidade (mm)
                                # nativo: src_x = random(0, len_x - pa_clr_dis_mm - 5)
gcode:
  {% set hot_min_temp  = params.HOT_MIN_TEMP|default(140)|float %}
  {% set hot_max_temp  = params.HOT_MAX_TEMP|default(printer.extruder.target)|float %}
  {% set bed_max_temp  = params.BED_MAX_TEMP|default(0)|float %}
  {% set fan_speed     = params.FAN_SPEED|default(255)|int %}

  {% set self    = printer["gcode_macro NOZZLE_CLEAR"] %}
  {% set x_s     = self.wiper_start_x + self.react_dis %}
  {% set x_e     = self.wiper_start_x + self.wiper_len_x - self.react_dis %}
  {% set y_w     = self.wiper_y %}
  {% set z_c     = self.wiper_z %}
  {% set z_a     = self.approach_z %}
  {% set spd     = self.wipe_speed|int %}
  {% set pk_spd  = self.park_speed|int %}
  {% set count   = self.wipe_count|int %}

  # [passo 1+2] inicia aquecimento do bed assíncrono; homing se necessário
  # nativo: também inicia nozzle async antes do homing check
  {% if bed_max_temp > 0 %}
    M140 S{bed_max_temp}
  {% endif %}

  # [passo 10a] aguarda temp mínima — amolece resíduo endurecido sem risco de queima
  # nativo: set_hot_temps(hot_min_temp, wait=True, err=10) — mesma lógica
  M104 S{hot_min_temp}
  M109 S{hot_min_temp}

  # [passo 2] verifica homing — nativo: ck_g28ed()
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

  # [passo 3/4 — omitido] nativo suspende mesh e altera parâmetros do stepper aqui;
  # não necessário pois usamos Z fixo (sem run_step_prtouch)

  # [passo 5/6] move para o wiper em Z de segurança
  # nativo: sorteio de X aleatório + Z-probing em src e end com sensor de pressão
  G90
  G1 Z{z_a} F3000
  G1 X{x_s} Y{y_w} F{pk_spd}

  # [passo 10b] sobe para hot_max_temp enquanto está posicionado acima do wiper
  # nativo: dispara hot_min_temp+40 async após sondagem src, aguarda hot_max_temp
  #         com bico JÁ POSICIONADO acima do wiper (src_z - pa_clr_down_mm)
  M104 S{hot_max_temp}
  M109 S{hot_max_temp}

  # [passo 7] desce ao Z de contato com o wiper
  # nativo: descida implícita no move para end_pos[2] + pa_clr_down_mm (-0.15mm
  #         abaixo da superfície detectada) — pressiona levemente o silicone
  G1 Z{z_c} F600

  # [passo 7] passadas de limpeza (múltiplas vs. única passada lenta do nativo)
  {% for i in range(count) %}
    G1 X{x_s} F{spd}
    G1 X{x_e} F{spd}
  {% endfor %}

  # [passo 8] liga ventilador de modelo P0 e resfria o bico
  # IMPORTANTE: nativo usa M106 sem P= (bug) que ativa P0 E P2 (câmara) no firmware
  # Creality. Aqui usamos M106 P0 explícito — apenas ventilador de modelo, correto.
  # nativo: set_fan_speed('fan', 1.0) logo após iniciar a passada; aqui ligamos
  #         após completar todas as passadas (mesma finalidade de resfriamento)
  M106 P0 S{fan_speed}
  M104 S{hot_min_temp}
  M109 S{hot_min_temp}

  # [passo 11] sobe do wiper, desliga fan de modelo
  # nativo: move para end + pa_clr_dis_mm (overshoot) antes de desligar fan
  G1 Z{z_a} F3000
  M106 P0 S0

  # [passo 11] aguarda bed atingir temp se pedido — nativo: set_bed_temps(wait=True)
  {% if bed_max_temp > 0 %}
    M190 S{bed_max_temp}
  {% endif %}
  # [passo 3/4 — omitido] nativo restaura mesh e parâmetros do stepper aqui

