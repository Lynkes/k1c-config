# Createdate: 2023/09/05
# Adapted: 2026/05/29 — Adaptado ao padrão Voron de sensorless homing
#
# MUDANÇAS PADRÃO VORON aplicadas neste arquivo:
#   1. _HOME_X / _HOME_Y: SET_TMC_CURRENT reduz corrente para ~0.49A antes do G28
#      e restaura a corrente de operação após o retract. Isso melhora a sensibilidade
#      do StallGuard2 e evita impacto excessivo no fim de curso sem sensor físico.
#      Referência: docs.vorondesign.com/tuning/sensorless.html
#
# PARTES ESPECÍFICAS DO K1C mantidas (não alteradas):
#   - FORCE_MOVE para pré-posicionamento Z/XY (necessário: CoreXZ sem referência no boot)
#   - G28 Z via prtouch_v2 (4 sensores piezo — exclusivo da K1C, não há probe Voron)
#   - Sequência dupla X→Y→X→Y (compensa folgas do sistema de correia da K1C)
#   - Variáveis xyz_ready (controle de estado interno da K1C)

[force_move]
    enable_force_move: true

[gcode_macro xyz_ready]
variable_x_ready: 0
variable_y_ready: 0
variable_z_ready: 0
variable_xy_moved: 0
variable_z_moved: 0
gcode:

[gcode_macro _IF_HOME_Z]
gcode:
  {% if printer['gcode_macro xyz_ready'].z_ready|int == 1 %}
    # Z já homeado — garante altura mínima de 5mm antes de qualquer movimento
    {% if printer.toolhead.position.z|float < 5.0 %}
      {% set z_park = 5.0 - printer.toolhead.position.z|float %}
      G91                        ; modo relativo
      G1 z{z_park} F600          ; sobe até Z=5mm (evita colisão na próxima descida)
      G90                        ; modo absoluto
    {% endif %}
  {% else %}
    # Z ainda não homeado — usa FORCE_MOVE para subir sem endstop (movimento forçado, sem referência)
    {% if printer['gcode_macro xyz_ready'].z_moved|int == 0 %}
      {% if printer.print_stats.z_pos|float <= 20.0 or printer.print_stats.power_loss == 1 %}
        # Início de impressão ou recuperação de queda de energia: sobe z_safe_g28 (3mm)
        FORCE_MOVE STEPPER=stepper_z DISTANCE={printer["gcode_macro PRINTER_PARAM"].z_safe_g28} VELOCITY=10
      {% else %}
        # Z já está alto (impressão em andamento): subida mínima de 0.1mm
        FORCE_MOVE STEPPER=stepper_z DISTANCE=0.1 VELOCITY=10
      {% endif %}
      SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_moved VALUE=1  ; marca: Z já foi movido
    {% endif %}
  {% endif %}

[gcode_macro _IF_MOVE_XY]
gcode:
  _IF_HOME_Z  ; garante Z em altura segura antes de mover XY
  {% if printer['gcode_macro xyz_ready'].xy_moved|int == 0 %}
    {action_respond_info("move xy\n")}
    # FORCE_MOVE STEPPER=stepper_x DISTANCE=14 VELOCITY=50  ; (desabilitado — X não precisa de pré-movimento)
    FORCE_MOVE STEPPER=stepper_y DISTANCE=-14 VELOCITY=50   ; empurra Y para longe do endstop (sem referência)
    FORCE_MOVE STEPPER=stepper_y DISTANCE=7 VELOCITY=50     ; recua 7mm (posiciona carro em região segura)
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=xy_moved VALUE=1  ; marca: XY já foram pré-posicionados
    G4 P1000  ; aguarda 1s para os drivers estabilizarem
  {% endif %}

[gcode_macro _HOME_X]
gcode:
  _IF_MOVE_XY  ; garante pré-posicionamento XY seguro antes do home X

  {% if printer['gcode_macro xyz_ready'].x_ready|int == 1 %}
    # X já homeado — se estiver perto do fim de curso (< 10mm de margem), afasta primeiro
    {% if (printer.configfile.settings['stepper_x'].position_max - printer.toolhead.position.x)|round < 10 %}
      {% set x_park = (10 - (printer.configfile.settings['stepper_x'].position_max - printer.toolhead.position.x))|round %}
      {% if x_park > 0 %}
        G91                      ; modo relativo
        G1 x-{x_park} F3600     ; afasta do fim de curso para dar margem ao G28 X
        G90                      ; modo absoluto
        G4 P1000                 ; aguarda 1s
      {% endif %}
    {% endif %}
  {% endif %}
  
  # [PADRÃO VORON] Reduz corrente para homing — StallGuard2 dispara com mais precisão
  # em corrente mais baixa (~40% da run_current). Evita impacto excessivo sem endstop físico.
  # [CoreXY] AMBOS os motores participam de qualquer movimento — ambos devem ter corrente reduzida.
  # Referência: docs.vorondesign.com/tuning/sensorless.html
  {% set HOME_CUR = 0.49 %}
  {% set RUN_CUR_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
  {% set RUN_CUR_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
  G4 P500              ; aguarda 500ms para corrente estabilizar antes do G28 (padrão Voron)
  G28 X                                                     ; home X via StallGuard (TMC2209)
  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=x_ready VALUE=1  ; marca X como homeado
  G91                  ; modo relativo
  G1 x-10 F3600        ; afasta 10mm do endstop (limpa o registro de stall do StallGuard)
  G90                  ; modo absoluto
  G4 P2000             ; aguarda 2s para os registros do StallGuard limparem
  # [PADRÃO VORON] Restaura corrente de operação normal após o home X
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR_X}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR_Y}

[gcode_macro _HOME_Y]
gcode:
  _IF_MOVE_XY  ; garante pré-posicionamento XY seguro antes do home Y

  {% if printer['gcode_macro xyz_ready'].y_ready|int == 1 %}
    # Y já homeado — se estiver perto do endstop (< 9mm), afasta primeiro
    {% if printer.toolhead.position.y|round < 9 %}
      {% set y_park = 9 - printer.toolhead.position.y|round %}
      {% if y_park > 0 %}
        G91                      ; modo relativo
        G1 y{y_park} F3600      ; afasta do endstop para dar margem ao G28 Y
        G90                      ; modo absoluto
        G4 P1000                 ; aguarda 1s
      {% endif %}
    {% endif %}
  {% endif %}

  # [PADRÃO VORON] Reduz corrente para homing — StallGuard2 dispara com mais precisão
  # em corrente mais baixa (~40% da run_current). Evita impacto excessivo sem endstop físico.
  # [CoreXY] AMBOS os motores participam de qualquer movimento — ambos devem ter corrente reduzida.
  # Referência: docs.vorondesign.com/tuning/sensorless.html
  {% set HOME_CUR = 0.49 %}
  {% set RUN_CUR_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
  {% set RUN_CUR_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
  G4 P500              ; aguarda 500ms para corrente estabilizar antes do G28 (padrão Voron)
  G28 Y                                                     ; home Y via StallGuard (TMC2209)
  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=y_ready VALUE=1  ; marca Y como homeado
  G91                  ; modo relativo
  G1 y10 F3600         ; afasta 10mm do endstop (limpa o registro de stall do StallGuard)
  G90                  ; modo absoluto
  G4 P2000             ; aguarda 2s para os registros do StallGuard limparem
  # [PADRÃO VORON] Restaura corrente de operação normal após o home Y
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR_X}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR_Y}

[gcode_macro _HOME_Z]
gcode:
  {% if printer['gcode_macro xyz_ready'].y_ready|int == 1 %}
    {% if printer['gcode_macro xyz_ready'].x_ready|int == 1 %}
      _IF_HOME_Z  ; garante Z seguro (sobe se necessário) antes do probe
    {% endif %}
  {% endif %}
  {% if printer.print_stats.z_pos|float >= 210.0 %}
    # Segurança: Z > 210mm — desce 8mm antes do home (evita colisão no fim de curso superior)
    FORCE_MOVE STEPPER=stepper_z DISTANCE=-8 VELOCITY=10
  {% endif %}

  {% set POSITION_X = printer['gcode_macro product_param'].bed_size_x / 2 %} #USA BED SIZE PARA CALCULAR O CENTRO, NÃO POSITION_MAX (que inclui offset do endstop)
  {% set POSITION_Y = printer['gcode_macro product_param'].bed_size_y / 2 %} #USA BED SIZE PARA CALCULAR O CENTRO, NÃO POSITION_MAX (que inclui offset do endstop)
  # BED_MESH_SET_DISABLE
  # Mover para o centro com G90 absoluto — evita propagar erro do stall sensorless no probe point
  # Centro calculado a partir de bed_size (220x220) e não de position_max (229/228 inclui offset do endstop)
  G90                                    ; posicionamento absoluto
  G1 X{POSITION_X} Y{POSITION_Y} F3600  ; move para o centro da cama: (110, 110)
  # G4 P500

  G28 Z                                  ; home Z via prtouch_v2 (4 sensores piezo na cama)
  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_ready VALUE=1  ; marca Z como homeado
  # BED_MESH_SET_ENABLE

[homing_override]
axes: xyz
# set_position_x: 0
# set_position_y: 0
# set_position_z:0
gcode:
  #{action_respond_info("homing_override")}
  M220 S100  ; reseta o fator de velocidade para 100% (evita home em velocidade reduzida)
  # SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=0  ; (desabilitado — stealthChop obrigatório para StallGuard)
  # SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE=0
  # BED_MESH_CLEAR

  # [CORREÇÃO] homed_axes é uma string com os eixos já homeados: "", "x", "xy", "xyz", etc.
  # Verificar 'x' in homed é correto; homed[0] verifica posição na string, não o eixo X.
  {% set homed = printer.toolhead.homed_axes %}
  {% if homed != "" %}
    # Eixos já homeados — loga o estado atual
    {action_respond_info("homed_axes: %s\n" % (homed))}
  {% else %}
    # Nenhum eixo homeado — zera todos os flags de estado do xyz_ready
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=x_ready VALUE=0   ; X não homeado
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=y_ready VALUE=0   ; Y não homeado
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_ready VALUE=0   ; Z não homeado
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=xy_moved VALUE=0  ; XY não foram pré-movidos
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_moved VALUE=0   ; Z não foi pré-movido
    {action_respond_info("homed_axes: nenhum\n")}
  {% endif %}

  {% if 'z' not in homed %}
    BED_MESH_CLEAR  ; Z não homeado → malha inválida, limpa para evitar dados obsoletos
  {% endif %}

  {% if 'x' in homed and 'y' in homed %}
    {% set position_y = printer.toolhead.position.y|int %}
    {% set max_y_position = printer["gcode_macro PRINTER_PARAM"].max_y_position|int %}
    {% if position_y >= max_y_position %}
      # Carro no limite Y máximo — recua 10mm antes do home (evita colisão)
      G91             ; modo relativo
      G0 Y-10 F3600   ; recua 10mm em Y
      G90             ; modo absoluto
    {% endif %}
  {% endif %}

  # home_all = True quando G28 sem parâmetros OU G28 Z sem XY homeados (segurança K1C:
  # não é possível centralizar para probe Z sem XY referenciados).
  # G28 Z com XY já homeados: home_all = False → pula home de XY.
  {% set home_all = 'X' not in params and 'Y' not in params %}
  {% if 'Z' in params and 'X' not in params and 'Y' not in params %}
    {% if 'x' in homed and 'y' in homed %}
      {% set home_all = 0 %}  # G28 Z com XY já homeados → pula home de XY
    {% endif %}
  {% endif %}

  # Sequência dupla X→Y→X→Y: segunda passagem compensa folgas e melhora precisão do sensorless
  {% if home_all or 'X' in params %}
    _HOME_X  ; 1ª passagem — home X
  {% endif %}

  {% if home_all or 'Y' in params %}
    _HOME_Y  ; 1ª passagem — home Y
  {% endif %}

  {% if home_all or 'X' in params %}
    _HOME_X  ; 2ª passagem — refinamento X
  {% endif %}

  {% if home_all or 'Y' in params %}
    _HOME_Y  ; 2ª passagem — refinamento Y
  {% endif %}

  {% if home_all or 'Z' in params %}
    _HOME_Z  ; home Z no centro da cama (110, 110) via prtouch_v2 (4 sensores piezo)
  {% endif %}
  {% if printer.configfile.config["bed_mesh default"] is defined %}
    BED_MESH_PROFILE LOAD="default"  ; recarrega a malha salva após o home completo
  {% endif %}
  # SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=1  ; (desabilitado — mantém stealthChop)
  # SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE=1
  # SET_TMC_FIELD FIELD=SGTHRS STEPPER=stepper_x VALUE=0  ; (desabilitado — mantém SGTHRS do printer.cfg)
  # SET_TMC_FIELD FIELD=SGTHRS STEPPER=stepper_y VALUE=0
  G4 P500  ; aguarda 500ms antes de retornar (estabilização dos drivers)
