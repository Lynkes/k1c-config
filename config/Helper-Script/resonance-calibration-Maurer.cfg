########################################
# Resonance Calibration Workflow       #Maurer
# Guided 3-step: belts → shapers → save
########################################

[gcode_macro CALIBRATE_RESONANCES]
description: Guided workflow - Belt check -> Shaper plots -> Save
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
    RESPOND TYPE=error MSG="Cannot calibrate while printing!"
  {% else %}
    {% if printer.toolhead.homed_axes != "xyz" %}
      RESPOND TYPE=command MSG="Homing..."
      G28
    {% endif %}
    RESPOND TYPE=command MSG="Step 1/3: Belt calibration — measuring A and B belts..."
    GUPPY_BELTS_SHAPER_CALIBRATION
    RESPOND TYPE=command MSG="Belt plot saved to: /usr/data/printer_data/config/belts_calibration.png"
    RESPOND TYPE=command MSG="action:prompt_begin Belt Calibration Complete"
    RESPOND TYPE=command MSG="action:prompt_text Open belts_calibration.png in Mainsail.\nAre the two belt curves similar and symmetric?\nIf not, adjust belt tension before continuing."
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
    RESPOND TYPE=command MSG="action:prompt_footer_button Continue to Shaper Plots|_CALIBRATE_RESONANCES_STEP2|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _CALIBRATE_RESONANCES_STEP2]
description: Step 2 - Run shaper frequency plots
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="Step 2/3: Measuring X and Y resonances and generating plots..."
  GUPPY_SHAPERS
  RESPOND TYPE=command MSG="Shaper plots saved: resonances_x.png / resonances_y.png"
  RESPOND TYPE=command MSG="action:prompt_begin Shaper Plots Complete"
  RESPOND TYPE=command MSG="action:prompt_text Review resonances_x.png and resonances_y.png in Mainsail.\nReady to run SHAPER_CALIBRATE and save to config?"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button Save & Apply|_CALIBRATE_RESONANCES_STEP3|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _CALIBRATE_RESONANCES_STEP3]
description: Step 3 - Run SHAPER_CALIBRATE and save
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="Step 3/3: Running SHAPER_CALIBRATE and saving config..."
  INPUT_SHAPER_CALIBRATION
